<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英语奇趣岛（中档版）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- 首页 -->
    <section class="screen active" id="screenHome">
      <div class="topbar">
        <button id="btnMute">🔊</button>
      </div>
      <div class="hero">
        <h1>🏝️ 英语奇趣岛</h1>
        <p>听一听 · 连一连 · 拼一拼</p>
        <p style="font-size:13px;color:#888">中档项目：6~8岁 听音找图+配对+拼词</p>
      </div>
      <button class="btn-primary" onclick="App.showTaskSelect()">🚀 开始游戏</button>
      <div class="foot-note">英语奇趣岛 · 中档实训</div>
    </section>

    <!-- 选择玩法 -->
    <section class="screen" id="screenTask">
      <div class="topbar">
        <button onclick="App.showHome()">🏠</button>
        <button id="btnMute">🔊</button>
      </div>
      <h2 style="text-align:center">选一种玩法</h2>
      <div class="task-grid">
        <button class="task-card" onclick="App.pickTask('listening')">
          <span class="emoji">🔊</span><span>听音找图</span>
        </button>
        <button class="task-card" onclick="App.pickTask('match')">
          <span class="emoji">🧩</span><span>词图配对</span>
        </button>
        <button class="task-card" onclick="App.pickTask('spell')">
          <span class="emoji">🔤</span><span>拼单词</span>
        </button>
      </div>
    </section>

    <!-- 主题选择 -->
    <section class="screen" id="screenTheme">
      <div class="topbar">
        <button onclick="App.showTaskSelect()">⬅️</button>
        <button id="btnMute">🔊</button>
      </div>
      <h2 style="text-align:center">选一个主题岛</h2>
      <div id="themeGrid"></div>
    </section>

    <!-- 游戏中 -->
    <section class="screen" id="screenGame">
      <div class="topbar">
        <button onclick="App.confirmExit()">🚪</button>
        <button id="btnMute">🔊</button>
      </div>
      <div id="progressWrap"><div id="progressBar"></div></div>
      <div id="stage"></div>
    </section>

    <!-- 结算 -->
    <section class="screen" id="screenResult">
      <div class="topbar">
        <button id="btnMute">🔊</button>
      </div>
      <h2 style="text-align:center">🎉 完成啦！</h2>
      <div id="resultText"></div>
      <div id="wrongReviewBox"></div>
      <button class="btn-primary" onclick="App.showThemeSelect()">🔁 再玩一次</button>
      <button class="btn-primary btn-secondary" onclick="App.showHome()">🏠 回首页</button>
    </section>

  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game-listening.js"></script>
  <script src="js/game-match.js"></script>
  <script src="js/game-spell.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
